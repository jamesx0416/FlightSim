<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Earth Demo - Google 3D Tiles</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .pointer-events-auto {
      pointer-events: auto;
    }
  </style>
  <!-- Import Map for CDN dependencies -->
  <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
                "three/examples/jsm/": "https://esm.sh/three@0.160.0/examples/jsm/",
                "three/examples/jsm/loaders/DRACOLoader.js": "https://esm.sh/three@0.160.0/examples/jsm/loaders/DRACOLoader.js",
                "3d-tiles-renderer": "https://esm.sh/3d-tiles-renderer@0.3.28?external=three"
            }
        }
    </script>
</head>

<body>
  <div id="canvas-container"></div>
  <div id="ui-layer"></div>

  <!-- Main Entry Point -->
  <script type="module" src="./main.js"></script>
</body>

</html>
