<!doctype html>
<html>
  <head>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.181.0/build/three.module.js",
          "three/webgpu": "https://unpkg.com/three@0.181.0/build/three.webgpu.js",
          "three/tsl": "https://unpkg.com/three@0.181.0/build/three.tsl.js",
          "three/addons/": "https://unpkg.com/three@0.181.0/examples/jsm/",
          "three/examples/jsm/": "https://unpkg.com/three@0.181.0/examples/jsm/",
          "three/src/": "https://unpkg.com/three@0.181.0/src/",
          "postprocessing": "https://unpkg.com/postprocessing@6.37.3/build/index.js",
          "@takram/three-geospatial": "https://unpkg.com/@takram/three-geospatial@0.5.1/build/index.js",
          "@takram/three-geospatial/shaders": "https://unpkg.com/@takram/three-geospatial@0.5.1/build/shaders.js",
          "@takram/three-geospatial/webgpu": "https://unpkg.com/@takram/three-geospatial@0.5.1/build/webgpu.js",
          "@takram/three-geospatial-effects": "https://unpkg.com/@takram/three-geospatial-effects@0.4.3/build/index.js",
          "@takram/three-atmosphere": "https://unpkg.com/@takram/three-atmosphere@0.15.1/build/index.js",
          "@takram/three-atmosphere/webgpu": "https://unpkg.com/@takram/three-atmosphere@0.15.1/build/webgpu.js",
          "3d-tiles-renderer": "https://unpkg.com/3d-tiles-renderer@0.4.21/build/index.three.js",
          "3d-tiles-renderer/plugins": "https://unpkg.com/3d-tiles-renderer@0.4.21/build/index.three-plugins.js",
          "3d-tiles-renderer/core/plugins": "https://unpkg.com/3d-tiles-renderer@0.4.21/build/index.core-plugins.js"
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>

  <body>
    <div id="container"></div>

    <script type="module">
      import {
        AgXToneMapping,
        Clock,
        PerspectiveCamera,
        Scene,
        Vector3
      } from 'three'
      import { TilesRenderer, GlobeControls } from '3d-tiles-renderer'
      import { GLTFExtensionsPlugin, CesiumIonAuthPlugin } from '3d-tiles-renderer/plugins'
      import { GoogleCloudAuthPlugin } from '3d-tiles-renderer/core/plugins'
      import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js'
      import {
        cameraProjectionMatrix,
        Fn,
        fwidth,
        modelViewMatrix,
        positionGeometry,
        screenDPR,
        screenSize,
        smoothstep,
        uniform,
        uv,
        vec4,
        pass,
        toneMapping
      } from 'three/tsl'
      import {
        MeshStandardNodeMaterial,
        NodeMaterial,
        PostProcessing,
        WebGPURenderer
      } from 'three/webgpu'

      import {
        getECIToECEFRotationMatrix,
        getMoonDirectionECI,
        getSunDirectionECI
      } from '@takram/three-atmosphere'
      import {
        AtmosphereContextNode,
        AtmosphereLight,
        AtmosphereLightNode,
        skyBackground
      } from '@takram/three-atmosphere/webgpu'
      import { Ellipsoid, Geodetic, radians } from '@takram/three-geospatial'
      import { dithering } from '@takram/three-geospatial/webgpu'

      function createPivotMaterial(pivotMesh) {
        const size = pivotMesh.size.mul(screenDPR)
        const thickness = pivotMesh.thickness.mul(screenDPR)
        const opacity = pivotMesh.opacity

        const material = new NodeMaterial()
        material.depthWrite = false
        material.depthTest = false
        material.transparent = true

        material.vertexNode = Fn(() => {
          const aspect = screenSize.x.div(screenSize.y)
          const offset = uv().mul(2).sub(1)
          offset.y.mulAssign(aspect)

          const screenPoint = cameraProjectionMatrix
            .mul(modelViewMatrix)
            .mul(vec4(positionGeometry, 1))
          screenPoint.xy.addAssign(
            offset.mul(size.add(thickness)).mul(screenPoint.w).div(screenSize.x)
          )
          return screenPoint
        })()

        material.outputNode = Fn(() => {
          const ht = thickness.mul(0.5)
          const planeDim = size.add(thickness)
          const offset = planeDim.sub(ht).sub(2).div(planeDim)
          const texelThickness = ht.div(planeDim)
          const vec = uv().mul(2).sub(1)
          const dist = vec.length().sub(offset).abs()
          const fw = fwidth(dist).mul(0.5)
          const a = smoothstep(texelThickness.sub(fw), texelThickness.add(fw), dist)
          return vec4(1, 1, 1, opacity.mul(a.oneMinus()))
        })()

        return material
      }

      function modifyPivotMesh(pivotMesh) {
        Object.assign(pivotMesh, {
          size: uniform(15),
          thickness: uniform(2),
          opacity: uniform(0.5)
        })
        pivotMesh.material.dispose()
        pivotMesh.material = createPivotMaterial(pivotMesh)
        pivotMesh.onBeforeRender = () => {}
        return pivotMesh
      }

      // DRACOLoader for compressed tiles:
      const dracoLoader = new DRACOLoader()
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/')

      // Geospatial configurations:
      const date = new Date('2000-06-01T10:00:00Z')
      const longitude = 139.7530 // Tokyo
      const latitude = 35.6852
      const height = 500 // In meters

      // API Key Configuration (set one):
      const GOOGLE_MAPS_API_KEY = ''  // https://console.cloud.google.com/apis/credentials
      const CESIUM_ION_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI2NmU2NTRlNC05MTBkLTRjMWMtYjA2Ny03OGQ4ZTMzYTlhYTMiLCJpZCI6MzUxNTIwLCJpYXQiOjE3NjA3MDQzMDJ9.VX86TPLi2ZSPLmhiRtrzPtaEU98t5XNGREa2BLPeKYs'    // https://ion.cesium.com/tokens

      async function init() {
        const container = document.getElementById('container')

        const renderer = new WebGPURenderer()
        renderer.highPrecision = true // Required when you work in ECEF coordinates

        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
        renderer.setSize(window.innerWidth, window.innerHeight)
        container.appendChild(renderer.domElement)
        await renderer.init()

        // Convert the geographic coordinates to ECEF coordinates in meters:
        const positionECEF = new Geodetic(
          radians(longitude),
          radians(latitude),
          height
        ).toECEF()

        const aspect = window.innerWidth / window.innerHeight
        const camera = new PerspectiveCamera(50, aspect, 1, 1e7)

        // Move the camera at the ECEF coordinates with the up vector pointing towards
        // the surface normal of the ellipsoid:
        const east = new Vector3()
        const north = new Vector3()
        Ellipsoid.WGS84.getEastNorthUpVectors(
          positionECEF,
          east,
          north,
          camera.up
        )
        camera.position.copy(positionECEF).sub(north.multiplyScalar(4)) // Heading north
        camera.lookAt(0, 0, 0)

        // The atmosphere context manages resources like LUTs and uniforms shared by
        // multiple nodes:
        const context = new AtmosphereContextNode()
        context.camera = camera

        // Create a scene with a sky background:
        const scene = new Scene()
        scene.backgroundNode = skyBackground(context).add(dithering)

        // Create 3D Tiles:
        let tiles = null
        if (GOOGLE_MAPS_API_KEY) {
          tiles = new TilesRenderer(`https://tile.googleapis.com/v1/3dtiles/root.json?key=${GOOGLE_MAPS_API_KEY}`)
          tiles.registerPlugin(new GoogleCloudAuthPlugin({ apiToken: GOOGLE_MAPS_API_KEY, autoRefreshToken: true }))
          tiles.registerPlugin(new GLTFExtensionsPlugin({ dracoLoader }))
        } else if (CESIUM_ION_TOKEN) {
          tiles = new TilesRenderer()
          tiles.registerPlugin(new CesiumIonAuthPlugin({ 
            apiToken: CESIUM_ION_TOKEN, 
            assetId: 2275207, // Google Photorealistic 3D Tiles
            autoRefreshToken: true 
          }))
          tiles.registerPlugin(new GLTFExtensionsPlugin({ dracoLoader }))
        }
        if (tiles) {
          tiles.setCamera(camera)
          tiles.setResolutionFromRenderer(camera, renderer)
          tiles.addEventListener('load-model', ({ scene: modelScene }) => {
            modelScene.traverse((object) => {
              if (object.isMesh) {
                const oldMaterial = object.material
                const oldMap = oldMaterial.map
                const oldColor = oldMaterial.color
                
                const newMaterial = new MeshStandardNodeMaterial()
                
                if (oldMap) {
                  newMaterial.map = oldMap.clone()
                }
                if (oldColor) {
                  newMaterial.color.copy(oldColor)
                }
                
                object.material = newMaterial
                if (oldMaterial.dispose) oldMaterial.dispose()
              }
            })
          })
          scene.add(tiles.group)
        }

        // AtmosphereLightNode must be associated with AtmosphereLight in the
        // renderer's node library before use:
        renderer.library.addLight(AtmosphereLightNode, AtmosphereLight)

        // Create the atmospheric light. Note that this story omits the atmospheric
        // scattering, which is only plausible when the distance between the camera
        // and scene objects is small enough to ignore it.
        const light = new AtmosphereLight(context)
        scene.add(light)

        const controls = new GlobeControls(scene, camera, renderer.domElement)
        controls.enableDamping = true
        modifyPivotMesh(controls.pivotMesh)
        if (tiles) {
          controls.setScene(tiles.group)
          if (tiles.ellipsoid) {
            controls.setEllipsoid(tiles.ellipsoid, tiles.group)
          }
        }

        // Post-processing for applying dithering after tone mapping:
        const passNode = pass(scene, camera, { samples: 4 })
        const toneMappingNode = toneMapping(AgXToneMapping, 3, passNode)
        const postProcessing = new PostProcessing(renderer)
        postProcessing.outputNode = toneMappingNode.add(dithering)

        // Rendering loop:
        const clock = new Clock()
        const observerECEF = new Vector3()
        void renderer.setAnimationLoop(() => {
          controls.update()
          camera.updateMatrixWorld()
          observerECEF.setFromMatrixPosition(camera.matrixWorld)

          // Update 3D tiles:
          if (tiles) {
            tiles.setResolutionFromRenderer(camera, renderer)
            tiles.update()
          }

          // Configure the planetary conditions in the atmosphere context according to
          // the current date and optionally the point of observation:
          // Real-time: 1 second = 1 second (multiply by 1000 to convert to ms)
          const currentDate = +date + (clock.getElapsedTime() * 1000)
          const matrixECIToECEF = getECIToECEFRotationMatrix(
            currentDate,
            context.matrixECIToECEF.value
          )
          getSunDirectionECI(
            currentDate,
            context.sunDirectionECEF.value,
            observerECEF
          ).applyMatrix4(matrixECIToECEF)
          getMoonDirectionECI(
            currentDate,
            context.moonDirectionECEF.value,
            observerECEF
          ).applyMatrix4(matrixECIToECEF)

          postProcessing.render()
        })

        // Resizing:
        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight
          camera.updateProjectionMatrix()
          renderer.setSize(window.innerWidth, window.innerHeight)
        }
        window.addEventListener('resize', handleResize)
      }

      init()
    </script>
  </body>
</html>
