<!--
  3D Tiles - Standalone WebGPU Demo
  Based on the 3DTilesRenderer story from storybook-webgpu

  Note: This requires a Cesium ion token for 3D tiles.
  Set your token in the CESIUM_ION_TOKEN constant below.
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Tiles - WebGPU</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.182.0/build/three.module.js",
          "three/webgpu": "https://unpkg.com/three@0.182.0/build/three.webgpu.js",
          "three/tsl": "https://unpkg.com/three@0.182.0/build/three.tsl.js",
          "three/addons/": "https://unpkg.com/three@0.182.0/examples/jsm/",
          "three/examples/jsm/": "https://unpkg.com/three@0.182.0/examples/jsm/",
          "three/src/": "https://unpkg.com/three@0.182.0/src/",
          "postprocessing": "https://unpkg.com/postprocessing@6.37.3/build/index.js",
          "@takram/three-geospatial": "https://unpkg.com/@takram/three-geospatial@0.5.1/build/index.js",
          "@takram/three-geospatial/webgpu": "https://unpkg.com/@takram/three-geospatial@0.5.1/build/webgpu.js",
          "@takram/three-geospatial/shaders": "https://unpkg.com/@takram/three-geospatial@0.5.1/build/shaders.js",
          "@takram/three-atmosphere": "https://unpkg.com/@takram/three-atmosphere@0.15.1/build/index.js",
          "@takram/three-atmosphere/webgpu": "https://unpkg.com/@takram/three-atmosphere@0.15.1/build/webgpu.js",
          "3d-tiles-renderer": "https://unpkg.com/3d-tiles-renderer@0.4.21/build/index.js",
          "3d-tiles-renderer/plugins": "https://unpkg.com/3d-tiles-renderer@0.4.21/build/index.plugins.js"
        }
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #container {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .message {
        position: absolute;
        top: 16px;
        left: 16px;
        right: 16px;
        color: white;
        font-family: system-ui;
        font-size: 14px;
        text-align: center;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        z-index: 100;
      }
      .error {
        background: rgba(180, 40, 40, 0.9);
        padding: 12px 16px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="message" class="message" style="display: none"></div>

    <script type="module">
      import { GlobeControls, TilesRenderer } from '3d-tiles-renderer'
      import {
        CesiumIonAuthPlugin,
        GLTFExtensionsPlugin,
        TileCompressionPlugin,
        UpdateOnChangePlugin
      } from '3d-tiles-renderer/plugins'
      import { AgXToneMapping, PerspectiveCamera, Scene, Vector3 } from 'three'
      import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js'
      import { mrt, output, pass, toneMapping } from 'three/tsl'
      import {
        MeshLambertNodeMaterial,
        PostProcessing,
        WebGPURenderer
      } from 'three/webgpu'

      import {
        getECIToECEFRotationMatrix,
        getMoonDirectionECI,
        getSunDirectionECI
      } from '@takram/three-atmosphere'
      import {
        aerialPerspective,
        AtmosphereContextNode,
        AtmosphereLight,
        AtmosphereLightNode
      } from '@takram/three-atmosphere/webgpu'
      import { Geodetic, PointOfView, radians } from '@takram/three-geospatial'
      import {
        dithering,
        highpVelocity,
        lensFlare,
        temporalAntialias
      } from '@takram/three-geospatial/webgpu'

      // ============================================
      // CONFIGURATION - Set your token here
      // ============================================
      const CESIUM_ION_TOKEN =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI2NmU2NTRlNC05MTBkLTRjMWMtYjA2Ny03OGQ4ZTMzYTlhYTMiLCJpZCI6MzUxNTIwLCJpYXQiOjE3NjA3MDQzMDJ9.VX86TPLi2ZSPLmhiRtrzPtaEU98t5XNGREa2BLPeKYs' // <-- Add your Cesium ion token here
      const CESIUM_ASSET_ID = '2275207' // Default asset ID

      // Location (adjust to match your asset)
      const CONFIG = {
        longitude: 138.5973,
        latitude: 35.2138,
        height: 0,
        heading: -94,
        pitch: -7,
        distance: 3231,
        dayOfYear: 180,
        timeOfDay: 12
      }

      function getLocalDate(longitude, dayOfYear, timeOfDay) {
        const year = new Date().getFullYear()
        const epoch = Date.UTC(year, 0, 1, 0, 0, 0, 0)
        const offset = longitude / 15
        return epoch + ((dayOfYear - 1) * 24 + timeOfDay - offset) * 3600000
      }

      const date = getLocalDate(
        CONFIG.longitude,
        CONFIG.dayOfYear,
        CONFIG.timeOfDay
      )

      const dracoLoader = new DRACOLoader()
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/')

      class TileMaterialReplacementPlugin {
        tiles = undefined
        overrideMaterial = MeshLambertNodeMaterial

        constructor(Material = MeshLambertNodeMaterial) {
          this.overrideMaterial = Material
        }

        init(tiles) {
          this.tiles = tiles
          tiles.group.traverse(object => {
            if (object.isMesh) this.replaceMaterial(object)
          })
          tiles.addEventListener('load-model', this.handleLoadModel)
          tiles.addEventListener('dispose-model', this.handleDisposeModel)
        }

        replaceMaterial(mesh) {
          const material = mesh.material
          const nodeMaterial = new this.overrideMaterial()
          if (material.map && 'map' in nodeMaterial) {
            nodeMaterial.map = material.map.clone()
          }
          mesh.material = nodeMaterial
          material.dispose()
        }

        handleLoadModel = ({ scene }) => {
          scene.traverse(object => {
            if (object.isMesh) this.replaceMaterial(object)
          })
        }

        handleDisposeModel = ({ scene }) => {
          scene.traverse(object => {
            if (object.isMesh && object.material) object.material.dispose()
          })
        }

        dispose() {
          this.tiles?.removeEventListener('load-model', this.handleLoadModel)
          this.tiles?.removeEventListener(
            'dispose-model',
            this.handleDisposeModel
          )
        }
      }

      function showMessage(text, isError = false) {
        const el = document.getElementById('message')
        el.textContent = text
        el.style.display = 'block'
        el.className = isError ? 'message error' : 'message'
      }

      async function init() {
        if (!CESIUM_ION_TOKEN) {
          showMessage('Set CESIUM_ION_TOKEN in the script', true)
          return
        }

        if (!navigator.gpu) {
          showMessage('WebGPU is not supported in your browser.', true)
          return
        }

        const adapter = await navigator.gpu.requestAdapter()
        if (!adapter) {
          showMessage('No WebGPU adapter found.', true)
          return
        }

        const container = document.getElementById('container')

        const renderer = new WebGPURenderer()
        renderer.highPrecision = true
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
        renderer.setSize(window.innerWidth, window.innerHeight)
        container.appendChild(renderer.domElement)
        await renderer.init()

        const aspect = window.innerWidth / window.innerHeight
        const camera = new PerspectiveCamera(75, aspect)

        new PointOfView(
          CONFIG.distance,
          radians(CONFIG.heading),
          radians(CONFIG.pitch)
        ).decompose(
          new Geodetic(
            radians(CONFIG.longitude),
            radians(CONFIG.latitude),
            CONFIG.height
          ).toECEF(),
          camera.position,
          camera.quaternion,
          camera.up
        )

        const context = new AtmosphereContextNode()
        context.camera = camera

        const scene = new Scene()

        // Register AtmosphereLightNode with renderer
        renderer.library.addLight(AtmosphereLightNode, AtmosphereLight)

        // Add atmosphere light to scene
        const light = new AtmosphereLight(context)
        scene.add(light)

        const tiles = new TilesRenderer()
        tiles.setCamera(camera)
        tiles.setResolutionFromRenderer(camera, renderer)
        tiles.registerPlugin(
          new CesiumIonAuthPlugin({
            apiToken: CESIUM_ION_TOKEN,
            assetId: CESIUM_ASSET_ID,
            autoRefreshToken: true
          })
        )
        tiles.registerPlugin(new GLTFExtensionsPlugin({ dracoLoader }))
        tiles.registerPlugin(new TileCompressionPlugin())
        tiles.registerPlugin(new UpdateOnChangePlugin())
        tiles.registerPlugin(
          new TileMaterialReplacementPlugin(MeshLambertNodeMaterial)
        )
        scene.add(tiles.group)

        const controls = new GlobeControls(scene, camera, renderer.domElement)
        controls.enableDamping = true
        controls.adjustHeight = false
        controls.addEventListener('start', () => {
          controls.adjustHeight = true
        })

        const passNode = pass(scene, camera, { samples: 0 }).setMRT(
          mrt({ output, velocity: highpVelocity })
        )
        const colorNode = passNode.getTextureNode('output')
        const depthNode = passNode.getTextureNode('depth')
        const velocityNode = passNode.getTextureNode('velocity')

        const aerialNode = aerialPerspective(context, colorNode, depthNode)
        const lensFlareNode = lensFlare(aerialNode)
        const toneMappingNode = toneMapping(AgXToneMapping, 5, lensFlareNode)
        const taaNode = temporalAntialias(highpVelocity)(
          toneMappingNode,
          depthNode,
          velocityNode,
          camera
        )

        const postProcessing = new PostProcessing(renderer)
        postProcessing.outputNode = taaNode.add(dithering)

        const observerECEF = new Vector3()
        void renderer.setAnimationLoop(() => {
          controls.update()
          camera.updateMatrixWorld()
          observerECEF.setFromMatrixPosition(camera.matrixWorld)

          const matrixECIToECEF = getECIToECEFRotationMatrix(
            date,
            context.matrixECIToECEF.value
          )
          getSunDirectionECI(
            date,
            context.sunDirectionECEF.value,
            observerECEF
          ).applyMatrix4(matrixECIToECEF)
          getMoonDirectionECI(
            date,
            context.moonDirectionECEF.value,
            observerECEF
          ).applyMatrix4(matrixECIToECEF)

          tiles.setCamera(camera)
          tiles.setResolutionFromRenderer(camera, renderer)
          tiles.update()

          postProcessing.render()
        })

        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight
          camera.updateProjectionMatrix()
          renderer.setSize(window.innerWidth, window.innerHeight)
        }
        window.addEventListener('resize', handleResize)

        showMessage('') // Hide loading message
      }

      init().catch(err => {
        console.error(err)
        showMessage(err.message || 'Unknown error', true)
      })
    </script>
  </body>
</html>
